<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LM Studio Vision Client - Ngrok Updated</title>
    <!-- 載入 React 相關腳本 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .typing-dot { animation: typing 1.4s infinite; }
        @keyframes typing { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // 自定義 SVG 圖標組件
        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                Send: (
                    <React.Fragment>
                        <path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>
                    </React.Fragment>
                ),
                ImageIcon: (
                    <React.Fragment>
                        <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
                    </React.Fragment>
                ),
                X: (
                    <React.Fragment>
                        <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
                    </React.Fragment>
                ),
                Globe: (
                    <React.Fragment>
                        <circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>
                    </React.Fragment>
                ),
                MessageSquare: <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>,
                Loader2: (
                    <React.Fragment>
                        <path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/>
                    </React.Fragment>
                ),
                Settings: (
                    <React.Fragment>
                        <path d="M12.22 2h-.44a2 2 0 0 0-2 2a2 2 0 0 1-2 2a2 2 0 0 0-2 2a2 2 0 0 1-2 2a2 2 0 0 0-2 2v.44a2 2 0 0 0 2 2a2 2 0 0 1 2 2a2 2 0 0 0 2 2a2 2 0 0 1 2 2a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2a2 2 0 0 1 2-2a2 2 0 0 0 2-2a2 2 0 0 1 2-2a2 2 0 0 0 2-2v-.44a2 2 0 0 0-2-2a2 2 0 0 1-2-2a2 2 0 0 0-2-2a2 2 0 0 1-2-2a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>
                    </React.Fragment>
                ),
                AlertCircle: (
                    <React.Fragment>
                        <circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>
                    </React.Fragment>
                ),
                CheckCircle2: (
                    <React.Fragment>
                        <circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>
                    </React.Fragment>
                ),
                Sliders: (
                    <React.Fragment>
                        <line x1="4" x2="4" y1="21" y2="14"/><line x1="4" x2="4" y1="10" y2="3"/><line x1="12" x2="12" y1="21" y2="12"/><line x1="12" x2="12" y1="8" y2="3"/><line x1="20" x2="20" y1="21" y2="16"/><line x1="20" x2="20" y1="12" y2="3"/><line x1="2" x2="6" y1="14" y2="14"/><line x1="10" x2="14" y1="8" y2="8"/><line x1="18" x2="22" y1="16" y2="16"/>
                    </React.Fragment>
                )
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || null}
                </svg>
            );
        };

        const App = () => {
            const [messages, setMessages] = useState([]);
            const [inputText, setInputText] = useState('');
            const [selectedImage, setSelectedImage] = useState(null);
            const [isLoading, setIsLoading] = useState(false);
            
            // 更新後的 Ngrok 地址
            const NGROK_URL = 'https://chace-nonprohibitory-adelina.ngrok-free.dev';
            
            // 設定狀態
            const [serverUrl, setServerUrl] = useState(() => localStorage.getItem('lm_studio_url') || NGROK_URL);
            const [modelId, setModelId] = useState(() => localStorage.getItem('lm_studio_model') || 'local-model');
            const [temperature, setTemperature] = useState(() => parseFloat(localStorage.getItem('lm_studio_temp')) || 0.7);
            const [systemPrompt, setSystemPrompt] = useState(() => localStorage.getItem('lm_studio_system') || '你是一個專業的 AI 助手，能夠分析圖片內容並提供精確回覆。');
            
            const [showSettings, setShowSettings] = useState(false);
            const [lastError, setLastError] = useState(null);
            const [connectionStatus, setConnectionStatus] = useState('idle');
            const chatEndRef = useRef(null);
            const fileInputRef = useRef(null);

            // 自動儲存設定至瀏覽器
            useEffect(() => {
                localStorage.setItem('lm_studio_url', serverUrl);
                localStorage.setItem('lm_studio_model', modelId);
                localStorage.setItem('lm_studio_temp', temperature.toString());
                localStorage.setItem('lm_studio_system', systemPrompt);
            }, [serverUrl, modelId, temperature, systemPrompt]);

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages]);

            const compressImage = (base64Str) => {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.src = base64Str;
                    img.onload = () => {
                        const MAX_WIDTH = 1024;
                        const canvas = document.createElement('canvas');
                        const scale = MAX_WIDTH / img.width;
                        const w = scale < 1 ? MAX_WIDTH : img.width;
                        const h = scale < 1 ? img.height * scale : img.height;
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.8));
                    };
                });
            };

            const handleImageChange = async (e) => {
                const file = e.target.files?.[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = async () => {
                        const compressed = await compressImage(reader.result);
                        setSelectedImage(compressed);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const testConnection = async () => {
                setConnectionStatus('testing');
                setLastError(null);
                try {
                    const res = await fetch(`${serverUrl}/v1/models`, { method: 'GET', mode: 'cors' });
                    if (res.ok) {
                        setConnectionStatus('success');
                    } else {
                        throw new Error(`伺服器回應錯誤: ${res.status}`);
                    }
                } catch (err) {
                    setConnectionStatus('error');
                    setLastError("連線失敗。請確認終端機的 Ngrok 正在運行，且端點網址正確無誤。");
                }
            };

            const handleSendMessage = async () => {
                if ((!inputText.trim() && !selectedImage) || isLoading) return;

                setLastError(null);
                const userMsg = {
                    role: 'user',
                    content: [
                        { type: 'text', text: inputText },
                        ...(selectedImage ? [{ type: 'image_url', image_url: { url: selectedImage } }] : [])
                    ],
                    timestamp: new Date().toLocaleTimeString(),
                    displayContent: inputText,
                    displayImage: selectedImage
                };

                setMessages(prev => [...prev, userMsg]);
                setInputText('');
                setSelectedImage(null);
                setIsLoading(true);

                const assistantMsgId = Date.now();
                setMessages(prev => [...prev, {
                    id: assistantMsgId,
                    role: 'assistant',
                    content: '',
                    timestamp: new Date().toLocaleTimeString(),
                    isStreaming: true
                }]);

                try {
                    const response = await fetch(`${serverUrl}/v1/chat/completions`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            model: modelId,
                            messages: [
                                { role: 'system', content: systemPrompt },
                                ...messages.filter(m => !m.isError).map(m => ({ role: m.role, content: m.content })),
                                { role: 'user', content: userMsg.content }
                            ],
                            stream: true,
                            temperature: temperature
                        }),
                    });

                    if (!response.ok) throw new Error(`連線失敗: ${response.status}`);

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let fullContent = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        const chunk = decoder.decode(value, { stream: true });
                        const lines = chunk.split('\n');
                        
                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                const dataStr = line.slice(6).trim();
                                if (dataStr === '[DONE]') continue;
                                try {
                                    const data = JSON.parse(dataStr);
                                    fullContent += (data.choices[0]?.delta?.content || '');
                                    setMessages(prev => prev.map(m => m.id === assistantMsgId ? { ...m, content: fullContent } : m));
                                } catch (e) {}
                            }
                        }
                    }
                    setMessages(prev => prev.map(m => m.id === assistantMsgId ? { ...m, isStreaming: false } : m));
                } catch (error) {
                    setLastError(error.message);
                    setMessages(prev => prev.filter(m => m.id !== assistantMsgId).concat({
                        role: 'system',
                        content: `通訊錯誤: ${error.message}。請確認 Ngrok 是否已啟動。`,
                        isError: true,
                        timestamp: new Date().toLocaleTimeString()
                    }));
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="flex flex-col h-screen bg-slate-50 text-slate-900 overflow-hidden">
                    <header className="flex items-center justify-between px-6 py-4 bg-white border-b border-slate-200 shadow-sm z-10">
                        <div className="flex items-center gap-2">
                            <div className="p-2 bg-indigo-600 rounded-lg shadow-lg">
                                <Icon name="Globe" className="w-5 h-5 text-white" />
                            </div>
                            <div>
                                <h1 className="text-lg font-bold leading-none tracking-tight">LM Studio Vision</h1>
                                <span className={`text-[10px] font-bold uppercase ${connectionStatus === 'success' ? 'text-emerald-500' : connectionStatus === 'error' ? 'text-red-500' : 'text-slate-400'}`}>
                                    ● {connectionStatus === 'success' ? '連線正常' : connectionStatus === 'error' ? '連線失敗' : '等待連線'}
                                </span>
                            </div>
                        </div>
                        <div className="flex gap-2">
                             <button 
                                onClick={() => {
                                    setServerUrl(NGROK_URL);
                                    testConnection();
                                }}
                                className="text-[10px] font-bold px-3 py-1 bg-slate-100 hover:bg-slate-200 rounded-full text-slate-600 transition-all shadow-sm"
                             >
                                重設為最新 Ngrok 地址
                             </button>
                             <button onClick={() => setShowSettings(!showSettings)} className={`p-2 rounded-full transition-all ${showSettings ? 'bg-indigo-50 text-indigo-600' : 'hover:bg-slate-100 text-slate-500'}`}>
                                <Icon name="Settings" className="w-5 h-5" />
                             </button>
                        </div>
                    </header>

                    {showSettings && (
                        <div className="bg-white border-b border-slate-200 p-6 shadow-inner animate-in slide-in-from-top duration-300 max-h-[80vh] overflow-y-auto">
                            <div className="max-w-3xl mx-auto space-y-6">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="space-y-4">
                                        <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                                            <Icon name="Globe" className="w-3 h-3" /> 網路設定
                                        </h3>
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-500 uppercase">API 端點 (Ngrok URL)</label>
                                            <div className="flex gap-2">
                                                <input 
                                                    type="text" 
                                                    value={serverUrl}
                                                    onChange={(e) => setServerUrl(e.target.value)}
                                                    className="flex-1 px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all"
                                                />
                                                <button onClick={testConnection} className="px-4 py-2 bg-slate-800 text-white rounded-xl text-xs font-bold hover:bg-slate-700 active:scale-95 transition-all">測試</button>
                                            </div>
                                        </div>
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-500 uppercase">模型名稱 (Model ID)</label>
                                            <input 
                                                type="text" 
                                                value={modelId}
                                                onChange={(e) => setModelId(e.target.value)}
                                                className="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all"
                                            />
                                        </div>
                                    </div>
                                    <div className="space-y-4">
                                        <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                                            <Icon name="Sliders" className="w-3 h-3" /> 生成參數
                                        </h3>
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-500 uppercase">隨機性 (Temp): {temperature}</label>
                                            <input 
                                                type="range" min="0" max="1" step="0.1" value={temperature}
                                                onChange={(e) => setTemperature(parseFloat(e.target.value))}
                                                className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600"
                                            />
                                        </div>
                                    </div>
                                </div>
                                <div className="space-y-2 pt-2 border-t border-slate-100">
                                    <label className="text-[10px] font-bold text-slate-500 uppercase">系統提示詞 (System Prompt)</label>
                                    <textarea 
                                        value={systemPrompt}
                                        onChange={(e) => setSystemPrompt(e.target.value)}
                                        className="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all font-medium"
                                        rows={3}
                                    />
                                </div>
                                {lastError && (
                                    <div className="p-3 bg-red-50 border border-red-100 rounded-xl text-xs text-red-600 flex items-start gap-2">
                                        <Icon name="AlertCircle" className="w-4 h-4 mt-0.5" />
                                        <p className="font-medium">{lastError}</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    <main className="flex-1 overflow-y-auto p-4 md:p-8">
                        <div className="max-w-4xl mx-auto space-y-8 pb-12">
                            {messages.length === 0 && (
                                <div className="flex flex-col items-center justify-center py-32 text-slate-300">
                                    <div className="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mb-6 shadow-inner">
                                        <Icon name="MessageSquare" className="w-10 h-10 opacity-20" />
                                    </div>
                                    <h3 className="text-slate-600 font-bold mb-1">對話準備就緒</h3>
                                    <p className="text-xs text-center leading-relaxed font-medium">連線至：{serverUrl}</p>
                                </div>
                            )}
                            {messages.map((msg, i) => (
                                <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'} animate-in fade-in slide-in-from-bottom-2 duration-300`}>
                                    <div className={`max-w-[85%] rounded-2xl p-4 shadow-sm ${
                                        msg.role === 'user' ? 'bg-indigo-600 text-white shadow-xl shadow-indigo-100/50' : msg.isError ? 'bg-red-50 text-red-700 border border-red-100' : 'bg-white border border-slate-200 text-slate-800'
                                    }`}>
                                        {msg.displayImage && <img src={msg.displayImage} className="max-h-80 rounded-xl mb-3 shadow-md border border-black/5" />}
                                        <div className="text-sm md:text-base leading-relaxed whitespace-pre-wrap font-medium">
                                            {msg.role === 'user' ? msg.displayContent : msg.content}
                                            {msg.isStreaming && <span className="inline-block w-1.5 h-4 bg-indigo-400 ml-1 typing-dot" />}
                                        </div>
                                        <div className={`text-[10px] mt-2 opacity-30 ${msg.role === 'user' ? 'text-right' : 'text-left'}`}>
                                            {msg.timestamp}
                                        </div>
                                    </div>
                                </div>
                            ))}
                            <div ref={chatEndRef} />
                        </div>
                    </main>

                    <footer className="p-4 md:p-6 bg-white border-t border-slate-200">
                        <div className="max-w-4xl mx-auto">
                            {selectedImage && (
                                <div className="relative inline-block mb-4 animate-in zoom-in duration-200">
                                    <img src={selectedImage} className="w-28 h-28 object-cover rounded-2xl border-2 border-indigo-500 shadow-2xl" />
                                    <button onClick={() => setSelectedImage(null)} className="absolute -top-3 -right-3 bg-red-500 text-white rounded-full p-1 shadow-lg hover:scale-110 transition-all">
                                        <Icon name="X" className="w-4 h-4" />
                                    </button>
                                </div>
                            )}
                            <div className="flex gap-4 items-end">
                                <div className="flex-1 flex items-end bg-slate-50 rounded-3xl border border-slate-200 focus-within:bg-white focus-within:border-indigo-400 focus-within:ring-4 focus-within:ring-indigo-50 transition-all p-3 shadow-inner">
                                    <button onClick={() => fileInputRef.current?.click()} className="p-2.5 text-slate-400 hover:text-indigo-600 transition-colors rounded-xl">
                                        <Icon name="ImageIcon" className="w-6 h-6" />
                                    </button>
                                    <input type="file" ref={fileInputRef} onChange={handleImageChange} accept="image/*" className="hidden" />
                                    <textarea 
                                        value={inputText}
                                        onChange={(e) => setInputText(e.target.value)}
                                        onKeyDown={(e) => e.key === 'Enter' && !e.shiftKey && (e.preventDefault(), handleSendMessage())}
                                        placeholder="對話或詢問圖片..."
                                        className="flex-1 bg-transparent border-none focus:ring-0 text-sm md:text-base py-3 px-2 resize-none max-h-48 outline-none font-medium"
                                        rows={1}
                                    />
                                </div>
                                <button 
                                    onClick={handleSendMessage} 
                                    disabled={isLoading || (!inputText.trim() && !selectedImage)}
                                    className="p-4 bg-indigo-600 text-white rounded-2xl shadow-xl shadow-indigo-100 hover:bg-indigo-700 disabled:bg-slate-200 disabled:text-slate-400 transition-all active:scale-90 flex items-center justify-center min-w-[64px] min-h-[64px]"
                                >
                                    {isLoading && messages[messages.length-1]?.isStreaming ? <Icon name="Loader2" className="w-7 h-7 animate-spin" /> : <Icon name="Send" className="w-7 h-7" />}
                                </button>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
