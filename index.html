<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LM Studio Vision - Pro Cloud</title>
    <!-- React & Tailwind -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        // 將 Firebase 功能掛載到全域物件
        window.FB = { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, signOut, getFirestore, doc, setDoc, getDoc, onSnapshot, collection, deleteDoc };
        // 觸發自定義事件通知 React Firebase 已就緒
        window.dispatchEvent(new Event('firebase-ready'));
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .typing-dot { animation: typing 1.4s infinite; }
        @keyframes typing { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
        .glass-panel { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // 自定義圖標組件
        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                Send: <React.Fragment><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></React.Fragment>,
                Stop: <React.Fragment><rect width="14" height="14" x="5" y="5" rx="2"/></React.Fragment>,
                Trash: <React.Fragment><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></React.Fragment>,
                User: <React.Fragment><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></React.Fragment>,
                Plus: <React.Fragment><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></React.Fragment>,
                ImageIcon: <React.Fragment><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></React.Fragment>,
                Settings: <React.Fragment><path d="M12.22 2h-.44a2 2 0 0 0-2 2a2 2 0 0 1-2 2a2 2 0 0 0-2 2a2 2 0 0 1-2 2a2 2 0 0 0-2 2v.44a2 2 0 0 0 2 2a2 2 0 0 1 2 2a2 2 0 0 0 2 2a2 2 0 0 1 2 2a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2a2 2 0 0 1 2-2a2 2 0 0 0 2-2a2 2 0 0 1 2-2a2 2 0 0 0 2-2v-.44a2 2 0 0 0-2-2a2 2 0 0 1-2-2a2 2 0 0 0-2-2a2 2 0 0 1-2-2a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></React.Fragment>,
                Logout: <React.Fragment><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></React.Fragment>,
                X: <React.Fragment><path d="M18 6 6 18"/><path d="m6 6 12 12"/></React.Fragment>,
                Loader: <React.Fragment><path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/></React.Fragment>
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || null}
                </svg>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [isAuthReady, setIsAuthReady] = useState(false);
            const [isLoggingIn, setIsLoggingIn] = useState(false);
            const [messages, setMessages] = useState([]);
            const [inputText, setInputText] = useState('');
            const [selectedImage, setSelectedImage] = useState(null);
            const [isLoading, setIsLoading] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            
            const [config, setConfig] = useState({
                serverUrl: 'https://chace-nonprohibitory-adelina.ngrok-free.dev',
                modelId: 'local-model',
                temperature: 0.7,
                systemPrompt: '你是一個專業的 AI 助手，能分析圖片並提供回答。'
            });

            const abortControllerRef = useRef(null);
            const chatEndRef = useRef(null);
            const fileInputRef = useRef(null);
            const [db, setDb] = useState(null);
            const [auth, setAuth] = useState(null);

            const appId = typeof __app_id !== 'undefined' ? __app_id : 'lm-vision-cloud';

            // 初始化 Firebase
            const initFirebase = async () => {
                if (!window.FB) return;
                try {
                    const firebaseConfig = JSON.parse(__firebase_config);
                    const app = FB.initializeApp(firebaseConfig);
                    const _auth = FB.getAuth(app);
                    const _db = FB.getFirestore(app);
                    setAuth(_auth);
                    setDb(_db);

                    // 設置登錄監聽
                    FB.onAuthStateChanged(_auth, (currentUser) => {
                        setUser(currentUser);
                        setIsAuthReady(true);
                        setIsLoggingIn(false);
                    });
                } catch (err) {
                    console.error("Firebase Init Error:", err);
                    setIsAuthReady(true); // 即使出錯也標記為 Ready 以顯示錯誤介面
                }
            };

            useEffect(() => {
                if (window.FB) {
                    initFirebase();
                } else {
                    window.addEventListener('firebase-ready', initFirebase);
                }
                return () => window.removeEventListener('firebase-ready', initFirebase);
            }, []);

            // 加載資料 (Firestore)
            useEffect(() => {
                if (!user || !db) return;

                const configDoc = FB.doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'current');
                const unsubConfig = FB.onSnapshot(configDoc, (doc) => {
                    if (doc.exists()) setConfig(doc.data());
                }, (err) => console.error("Firestore Config Error:", err));

                const chatDoc = FB.doc(db, 'artifacts', appId, 'users', user.uid, 'chats', 'history');
                const unsubChat = FB.onSnapshot(chatDoc, (doc) => {
                    if (doc.exists()) setMessages(doc.data().messages || []);
                }, (err) => console.error("Firestore Chat Error:", err));

                return () => { unsubConfig(); unsubChat(); };
            }, [user, db]);

            const saveConfig = async (newConfig) => {
                if (!user || !db) return;
                try {
                    await FB.setDoc(FB.doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'current'), newConfig);
                } catch (e) { console.error("Save Config Fail:", e); }
            };

            const saveMessages = async (newMessages) => {
                if (!user || !db) return;
                try {
                    await FB.setDoc(FB.doc(db, 'artifacts', appId, 'users', user.uid, 'chats', 'history'), { messages: newMessages });
                } catch (e) { console.error("Save Messages Fail:", e); }
            };

            const handleLogin = async () => {
                if (!auth || isLoggingIn) return;
                setIsLoggingIn(true);
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await FB.signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await FB.signInAnonymously(auth);
                    }
                } catch (err) {
                    console.error("Login Error:", err);
                    alert("登錄失敗，請檢查網路連線或 Firebase 設定。");
                    setIsLoggingIn(false);
                }
            };

            const stopGeneration = () => {
                if (abortControllerRef.current) {
                    abortControllerRef.current.abort();
                    setIsLoading(false);
                }
            };

            const startNewChat = async () => {
                if (!confirm("確定要清空目前所有對話紀錄嗎？")) return;
                setMessages([]);
                await saveMessages([]);
            };

            const handleSendMessage = async () => {
                if ((!inputText.trim() && !selectedImage) || isLoading) return;

                const userMsg = {
                    role: 'user',
                    content: [
                        { type: 'text', text: inputText },
                        ...(selectedImage ? [{ type: 'image_url', image_url: { url: selectedImage } }] : [])
                    ],
                    timestamp: new Date().toLocaleTimeString(),
                    displayContent: inputText,
                    displayImage: selectedImage
                };

                const updatedMessages = [...messages, userMsg];
                setMessages(updatedMessages);
                setInputText('');
                setSelectedImage(null);
                setIsLoading(true);

                const assistantMsgId = Date.now();
                const placeholderAssistant = { id: assistantMsgId, role: 'assistant', content: '', timestamp: new Date().toLocaleTimeString(), isStreaming: true };
                setMessages([...updatedMessages, placeholderAssistant]);

                abortControllerRef.current = new AbortController();

                try {
                    const response = await fetch(`${config.serverUrl}/v1/chat/completions`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            model: config.modelId,
                            messages: [
                                { role: 'system', content: config.systemPrompt },
                                ...updatedMessages.map(m => ({ role: m.role, content: m.content })),
                            ],
                            stream: true,
                            temperature: config.temperature
                        }),
                        signal: abortControllerRef.current.signal
                    });

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let fullContent = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        const chunk = decoder.decode(value);
                        const lines = chunk.split('\n').filter(l => l.trim() !== '');
                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                const dataStr = line.slice(6);
                                if (dataStr === '[DONE]') continue;
                                try {
                                    const json = JSON.parse(dataStr);
                                    const char = json.choices[0]?.delta?.content || '';
                                    fullContent += char;
                                    setMessages(prev => prev.map(m => m.id === assistantMsgId ? { ...m, content: fullContent } : m));
                                } catch(e) {}
                            }
                        }
                    }
                    
                    const finalMessages = [...updatedMessages, { role: 'assistant', content: fullContent, timestamp: new Date().toLocaleTimeString() }];
                    setMessages(finalMessages);
                    await saveMessages(finalMessages);
                } catch (error) {
                    if (error.name !== 'AbortError') {
                        setMessages(prev => [...prev, { role: 'system', content: `連線錯誤: ${error.message}`, isError: true }]);
                    }
                } finally {
                    setIsLoading(false);
                }
            };

            // 載入中狀態
            if (!isAuthReady && !user) {
                return (
                    <div className="h-screen flex items-center justify-center bg-slate-100">
                        <div className="text-center space-y-4">
                            <Icon name="Loader" className="w-10 h-10 animate-spin text-indigo-600 mx-auto" />
                            <p className="text-slate-500 font-medium">正在初始化 Firebase...</p>
                        </div>
                    </div>
                );
            }

            // 登錄介面
            if (!user) {
                return (
                    <div className="h-screen flex items-center justify-center bg-indigo-600">
                        <div className="bg-white p-8 rounded-3xl shadow-2xl text-center space-y-6 animate-in zoom-in duration-300 mx-4 max-w-sm w-full">
                            <div className="w-20 h-20 bg-indigo-100 rounded-full flex items-center justify-center mx-auto">
                                <Icon name="User" className="w-10 h-10 text-indigo-600" />
                            </div>
                            <div>
                                <h1 className="text-2xl font-black text-slate-800">登錄您的 AI 助手</h1>
                                <p className="text-slate-400 text-sm mt-2">對話紀錄與模型設定將自動同步</p>
                            </div>
                            <button 
                                onClick={handleLogin}
                                disabled={!auth || isLoggingIn}
                                className={`w-full py-4 rounded-2xl font-bold shadow-lg transition-all flex items-center justify-center gap-2 ${
                                    (!auth || isLoggingIn) ? 'bg-slate-300 text-slate-500 cursor-not-allowed' : 'bg-indigo-600 text-white hover:bg-indigo-700 active:scale-95'
                                }`}
                            >
                                {isLoggingIn ? <Icon name="Loader" className="w-5 h-5 animate-spin" /> : null}
                                {isLoggingIn ? '正在登錄...' : '立即進入'}
                            </button>
                            {!auth && <p className="text-xs text-red-500 mt-2">Firebase 尚未準備就緒，請檢查連線。</p>}
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-screen overflow-hidden">
                    <header className="px-6 py-4 bg-white border-b border-slate-200 flex items-center justify-between shadow-sm z-20">
                        <div className="flex items-center gap-3">
                            <div className="p-2 bg-indigo-600 rounded-xl"><Icon name="MessageSquare" className="w-5 h-5 text-white" /></div>
                            <div>
                                <h2 className="font-black text-slate-800 leading-tight">LM Studio Cloud</h2>
                                <p className="text-[10px] text-slate-400 font-mono">ID: {user.uid.slice(0,8)}...</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={startNewChat} className="p-2.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-full transition-all" title="清空紀錄">
                                <Icon name="Trash" className="w-5 h-5" />
                            </button>
                            <button onClick={() => setShowSettings(!showSettings)} className={`p-2.5 rounded-full transition-all ${showSettings ? 'bg-indigo-100 text-indigo-600' : 'text-slate-400 hover:bg-slate-100'}`}>
                                <Icon name="Settings" className="w-5 h-5" />
                            </button>
                        </div>
                    </header>

                    {showSettings && (
                        <div className="bg-white border-b border-slate-200 p-6 shadow-inner z-10 max-h-[70vh] overflow-y-auto animate-in slide-in-from-top duration-300">
                            <div className="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div className="space-y-4">
                                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">API Endpoint</label>
                                    <input value={config.serverUrl} onChange={e => setConfig({...config, serverUrl: e.target.value})} onBlur={() => saveConfig(config)} className="w-full px-4 py-2 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" />
                                    
                                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Temperature: {config.temperature}</label>
                                    <input type="range" min="0" max="1" step="0.1" value={config.temperature} onChange={e => setConfig({...config, temperature: parseFloat(e.target.value)})} onMouseUp={() => saveConfig(config)} className="w-full accent-indigo-600" />
                                </div>
                                <div className="space-y-4">
                                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">System Prompt</label>
                                    <textarea value={config.systemPrompt} onChange={e => setConfig({...config, systemPrompt: e.target.value})} onBlur={() => saveConfig(config)} className="w-full px-4 py-2 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 h-24 resize-none text-sm font-medium" />
                                </div>
                            </div>
                        </div>
                    )}

                    <main className="flex-1 overflow-y-auto p-4 md:p-8 space-y-6">
                        <div className="max-w-4xl mx-auto pb-10">
                            {messages.length === 0 && (
                                <div className="py-20 text-center space-y-4 opacity-30">
                                    <Icon name="MessageSquare" className="w-16 h-16 mx-auto" />
                                    <p className="font-bold">尚未開始任何對話</p>
                                </div>
                            )}
                            {messages.map((msg, i) => (
                                <div key={i} className={`flex mb-8 ${msg.role === 'user' ? 'justify-end' : 'justify-start'} animate-in fade-in slide-in-from-bottom-2`}>
                                    <div className={`max-w-[85%] p-4 rounded-2xl shadow-sm ${
                                        msg.role === 'user' ? 'bg-indigo-600 text-white shadow-indigo-200' : msg.isError ? 'bg-red-50 text-red-600 border border-red-100' : 'bg-white border border-slate-200 text-slate-800'
                                    }`}>
                                        {msg.displayImage && <img src={msg.displayImage} className="max-h-80 rounded-xl mb-3 shadow-sm" />}
                                        <div className="text-sm md:text-base leading-relaxed whitespace-pre-wrap font-medium">
                                            {msg.role === 'user' ? msg.displayContent : msg.content}
                                            {msg.isStreaming && <span className="inline-block w-1.5 h-4 bg-indigo-400 ml-1 typing-dot" />}
                                        </div>
                                    </div>
                                </div>
                            ))}
                            <div ref={chatEndRef} />
                        </div>
                    </main>

                    <footer className="p-4 md:p-6 bg-white border-t border-slate-200 glass-panel">
                        <div className="max-w-4xl mx-auto">
                            {selectedImage && (
                                <div className="relative inline-block mb-4 animate-in zoom-in duration-200">
                                    <img src={selectedImage} className="w-24 h-24 object-cover rounded-2xl border-2 border-indigo-500 shadow-xl" />
                                    <button onClick={() => setSelectedImage(null)} className="absolute -top-3 -right-3 bg-red-500 text-white rounded-full p-1.5 shadow-lg"><Icon name="X" className="w-4 h-4" /></button>
                                </div>
                            )}
                            <div className="flex gap-4 items-end">
                                <div className="flex-1 flex items-end bg-slate-100 rounded-3xl border border-slate-200 focus-within:bg-white focus-within:border-indigo-400 transition-all p-2 shadow-inner">
                                    <button onClick={() => fileInputRef.current.click()} className="p-3 text-slate-400 hover:text-indigo-600 transition-colors"><Icon name="ImageIcon" className="w-6 h-6" /></button>
                                    <input type="file" ref={fileInputRef} onChange={e => {
                                        const file = e.target.files[0];
                                        if (file) {
                                            const reader = new FileReader();
                                            reader.onload = () => setSelectedImage(reader.result);
                                            reader.readAsDataURL(file);
                                        }
                                    }} accept="image/*" className="hidden" />
                                    <textarea 
                                        value={inputText}
                                        onChange={e => setInputText(e.target.value)}
                                        onKeyDown={e => e.key === 'Enter' && !e.shiftKey && (e.preventDefault(), handleSendMessage())}
                                        placeholder="輸入訊息..."
                                        className="flex-1 bg-transparent border-none focus:ring-0 text-sm md:text-base py-3 outline-none resize-none max-h-48"
                                        rows={1}
                                    />
                                </div>
                                <button 
                                    onClick={isLoading ? stopGeneration : handleSendMessage} 
                                    disabled={!isLoading && !inputText.trim() && !selectedImage}
                                    className={`p-4 rounded-2xl shadow-xl transition-all active:scale-90 min-w-[64px] flex items-center justify-center ${
                                        isLoading ? 'bg-red-500 text-white hover:bg-red-600' : 'bg-indigo-600 text-white hover:bg-indigo-700 disabled:bg-slate-200'
                                    }`}
                                >
                                    {isLoading ? <Icon name="Stop" className="w-7 h-7" /> : <Icon name="Send" className="w-7 h-7" />}
                                </button>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
